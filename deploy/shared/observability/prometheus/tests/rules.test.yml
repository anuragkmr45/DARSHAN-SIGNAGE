rule_files:
  - ../rules/recording-rules.yml
  - ../rules/alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="prometheus",instance="127.0.0.1:9090",role="observability",machine="local",site="dev"}'
        values: "1+0x21"
      - series: 'up{job="darshan-server",instance="10.0.0.20:3000",role="backend",machine="vm2",site="dev"}'
        values: "0+0x21"
      - series: 'up{job="vm1-postgres",instance="10.0.0.10:9187",role="data",machine="vm1",site="dev"}'
        values: "1+0x21"
      - series: 'up{job="vm1-minio",instance="10.0.0.10:9000",role="data",machine="vm1",site="dev"}'
        values: "1+0x21"
      - series: 'node_memory_MemAvailable_bytes{job="vm2-node",instance="10.0.0.20:9100",role="backend",machine="vm2",site="dev"}'
        values: "20+0x21"
      - series: 'node_memory_MemTotal_bytes{job="vm2-node",instance="10.0.0.20:9100",role="backend",machine="vm2",site="dev"}'
        values: "100+0x21"
      - series: 'node_memory_MemAvailable_bytes{job="vm1-node",instance="10.0.0.10:9100",role="data",machine="vm1",site="dev"}'
        values: "15+0x21"
      - series: 'node_memory_MemTotal_bytes{job="vm1-node",instance="10.0.0.10:9100",role="data",machine="vm1",site="dev"}'
        values: "100+0x21"
      - series: 'node_filesystem_avail_bytes{job="vm2-node",instance="10.0.0.20:9100",role="backend",machine="vm2",site="dev",fstype="ext4",mountpoint="/",device="/dev/sda1"}'
        values: "5+0x21"
      - series: 'node_filesystem_size_bytes{job="vm2-node",instance="10.0.0.20:9100",role="backend",machine="vm2",site="dev",fstype="ext4",mountpoint="/",device="/dev/sda1"}'
        values: "100+0x21"
      - series: 'node_filesystem_avail_bytes{job="vm1-node",instance="10.0.0.10:9100",role="data",machine="vm1",site="dev",fstype="ext4",mountpoint="/",device="/dev/sda1"}'
        values: "10+0x21"
      - series: 'node_filesystem_size_bytes{job="vm1-node",instance="10.0.0.10:9100",role="data",machine="vm1",site="dev",fstype="ext4",mountpoint="/",device="/dev/sda1"}'
        values: "100+0x21"
      - series: 'node_cpu_seconds_total{job="vm2-node",instance="10.0.0.20:9100",role="backend",machine="vm2",site="dev",mode="idle",cpu="0"}'
        values: "0+0x21"
      - series: 'node_cpu_seconds_total{job="vm2-node",instance="10.0.0.20:9100",role="backend",machine="vm2",site="dev",mode="system",cpu="0"}'
        values: "0+1x21"
      - series: 'pg_up{job="vm1-postgres",instance="10.0.0.10:9187",role="data",machine="vm1",site="dev"}'
        values: "0+0x21"
      - series: 'darshan_fleet_players_total{state="ACTIVE",site="dev"}'
        values: "3+0x21"
      - series: 'darshan_fleet_players_total{state="OFFLINE",site="dev"}'
        values: "2+0x21"
      - series: 'darshan_fleet_players_total{state="INACTIVE",site="dev"}'
        values: "0+0x21"
      - series: 'darshan_fleet_latest_heartbeat_age_seconds{site="dev"}'
        values: "700+0x21"
      - series: 'darshan_server_command_outbox_oldest_pending_age_seconds{site="dev"}'
        values: "180+0x21"
      - series: 'darshan_server_command_outbox_rows{status="PENDING",site="dev"}'
        values: "25+0x21"
      - series: 'darshan_server_command_outbox_dispatch_total{result="failed",event_type="COMMAND_AVAILABLE",site="dev"}'
        values: "0+1x21"
      - series: 'darshan_server_websocket_notification_payload_too_large_total{type="COMMAND_AVAILABLE",site="dev"}'
        values: "0+1x21"
      - series: 'darshan_server_device_commands_claimed_total{source="poll",site="dev"}'
        values: "0+2x21"
      - series: 'darshan_server_realtime_socket_connections{namespace="/device",site="dev"}'
        values: "0+0x21"
      - series: 'darshan_server_realtime_socket_disconnect_total{namespace="/device",reason="transport_close",site="dev"}'
        values: "0+60x21"
      - series: 'darshan_server_player_realtime_diagnostics_total{connection_state="WSS_HEALTHY",player_release_alignment="match",server_release_alignment="match",site="dev"}'
        values: "0+100x21"
      - series: 'darshan_server_player_realtime_diagnostics_total{connection_state="REST_FALLBACK",player_release_alignment="mismatch",server_release_alignment="mismatch",site="dev"}'
        values: "0+100x21"
      - series: 'darshan_server_device_realtime_auth_total{result="failure",reason="Missing device identity",site="dev"}'
        values: "0+60x21"
      - series: 'darshan_server_device_command_acks_total{result="success",site="dev"}'
        values: "0+100x21"
      - series: 'darshan_server_device_command_acks_total{result="failure",site="dev"}'
        values: "0+20x21"
      - series: 'darshan_server_device_commands_rows{status="DEAD_LETTER",site="dev"}'
        values: "1+0x21"
      - series: 'darshan_server_device_commands_rows{status="EXPIRED",site="dev"}'
        values: "0+0x21"
      - series: 'darshan_server_media_cache_reports_total{result="accepted",severity="ERROR",event_type="DOWNLOAD_FAILED",site="dev"}'
        values: "0+10x21"
      - series: 'darshan_server_media_cache_reports_unresolved{severity="CRITICAL",event_type="DISK_FULL",site="dev"}'
        values: "1+0x21"
    promql_expr_test:
      - expr: 'darshan:host_memory_utilization:ratio{job="vm2-node",instance="10.0.0.20:9100",role="backend",machine="vm2",site="dev"}'
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="darshan:host_memory_utilization:ratio",job="vm2-node",instance="10.0.0.20:9100",role="backend",machine="vm2",site="dev"}'
            value: 0.8
      - expr: 'darshan:fleet_offline_players_ratio{site="dev"}'
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="darshan:fleet_offline_players_ratio",site="dev"}'
            value: 0.4
      - expr: 'darshan:realtime_outbox_pending_rows{site="dev"}'
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="darshan:realtime_outbox_pending_rows",site="dev"}'
            value: 25
      - expr: 'darshan:device_command_ack_failure_ratio{site="dev"}'
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="darshan:device_command_ack_failure_ratio",site="dev"}'
            value: 0.16666666666666666
    alert_rule_test:
      - eval_time: 20m
        alertname: DARSHANBackendMetricsUnavailable
        exp_alerts:
          - exp_labels:
              alertname: DARSHANBackendMetricsUnavailable
              instance: 10.0.0.20:3000
              job: darshan-server
              machine: vm2
              role: backend
              severity: critical
              site: dev
              team: platform
            exp_annotations:
              summary: "Backend metrics are unavailable"
              description: "darshan-server on 10.0.0.20:3000 has been unreachable for 5 minutes."
      - eval_time: 20m
        alertname: DARSHANHostFilesystemHigh
        exp_alerts:
          - exp_labels:
              alertname: DARSHANHostFilesystemHigh
              instance: 10.0.0.20:9100
              job: vm2-node
              machine: vm2
              role: backend
              severity: critical
              site: dev
              team: platform
            exp_annotations:
              summary: "Host filesystem utilization is high"
              description: "vm2-node on 10.0.0.20:9100 has a filesystem above 90% utilization."
      - eval_time: 20m
        alertname: DARSHANPostgresUnavailable
        exp_alerts:
          - exp_labels:
              alertname: DARSHANPostgresUnavailable
              instance: 10.0.0.10:9187
              job: vm1-postgres
              machine: vm1
              role: data
              severity: critical
              site: dev
              team: platform
            exp_annotations:
              summary: "PostgreSQL is unavailable"
              description: "postgres_exporter can reach 10.0.0.10:9187, but PostgreSQL is reporting down."
      - eval_time: 20m
        alertname: DARSHANFleetHeartbeatsStalled
        exp_alerts:
          - exp_labels:
              alertname: DARSHANFleetHeartbeatsStalled
              severity: critical
              site: dev
              team: platform
            exp_annotations:
              summary: "Player fleet heartbeats are stalled"
              description: "The backend has not recorded a fresh player heartbeat for more than 10 minutes."
      - eval_time: 20m
        alertname: DARSHANFleetOfflinePlayersHigh
        exp_alerts:
          - exp_labels:
              alertname: DARSHANFleetOfflinePlayersHigh
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Offline player ratio is elevated"
              description: "More than 25% of the known player fleet has been marked OFFLINE for 15 minutes."
      - eval_time: 20m
        alertname: DARSHANRealtimeOutboxLagHigh
        exp_alerts:
          - exp_labels:
              alertname: DARSHANRealtimeOutboxLagHigh
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Realtime outbox lag is elevated"
              description: "The oldest pending realtime outbox row has been waiting for more than 2 minutes."
      - eval_time: 20m
        alertname: DARSHANRealtimeOutboxDispatchFailures
        exp_alerts:
          - exp_labels:
              alertname: DARSHANRealtimeOutboxDispatchFailures
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Realtime outbox dispatch failures detected"
              description: "The outbox dispatcher has recorded failed notification dispatch attempts."
      - eval_time: 20m
        alertname: DARSHANRealtimePayloadTooLarge
        exp_alerts:
          - exp_labels:
              alertname: DARSHANRealtimePayloadTooLarge
              severity: critical
              site: dev
              team: platform
            exp_annotations:
              summary: "Realtime notification payload rejected"
              description: "One or more websocket notification payloads exceeded the configured hard limit."
      - eval_time: 20m
        alertname: DARSHANRealtimeExpectedDeviceConnectionsMissing
        exp_alerts:
          - exp_labels:
              alertname: DARSHANRealtimeExpectedDeviceConnectionsMissing
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "No expected player realtime connections are present"
              description: "The fleet has known players but no active /device WebSocket connections. Players should enter bounded REST fallback; investigate TLS, proxy Upgrade forwarding, and network reachability."
      - eval_time: 20m
        alertname: DARSHANRealtimeReconnectStorm
        exp_alerts:
          - exp_labels:
              alertname: DARSHANRealtimeReconnectStorm
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Player realtime reconnect storm detected"
              description: "Device Socket.IO disconnects have exceeded 30 per minute for 10 minutes. Investigate network instability, proxy restarts, and backend saturation."
      - eval_time: 20m
        alertname: DARSHANRealtimeFallbackPlayersHigh
        exp_alerts:
          - exp_labels:
              alertname: DARSHANRealtimeFallbackPlayersHigh
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Too many players are in REST fallback mode"
              description: "More than 25% of recent player heartbeat diagnostics report REST fallback instead of healthy WSS."
      - eval_time: 20m
        alertname: DARSHANMixedPlayerReleaseIds
        exp_alerts:
          - exp_labels:
              alertname: DARSHANMixedPlayerReleaseIds
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Player release differs from the backend release"
              description: "Recent player heartbeat diagnostics report a player release ID different from the installed backend release. Verify source-free artifact provenance and staged rollout status."
      - eval_time: 20m
        alertname: DARSHANRealtimeAuthFailuresHigh
        exp_alerts:
          - exp_labels:
              alertname: DARSHANRealtimeAuthFailuresHigh
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Realtime device authentication failures are elevated"
              description: "Device websocket authentication failures exceed 0.5 attempts per second."
      - eval_time: 20m
        alertname: DARSHANCommandAckFailuresHigh
        exp_alerts:
          - exp_labels:
              alertname: DARSHANCommandAckFailuresHigh
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Device command ACK failures are elevated"
              description: "More than 10% of command acknowledgements are failing or returning error."
      - eval_time: 20m
        alertname: DARSHANDeviceCommandDeadLettersPresent
        exp_alerts:
          - exp_labels:
              alertname: DARSHANDeviceCommandDeadLettersPresent
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Terminal failed device commands are present"
              description: "Device commands have reached DEAD_LETTER or EXPIRED status and need operator review."
      - eval_time: 20m
        alertname: DARSHANMediaCacheFailuresHigh
        exp_alerts:
          - exp_labels:
              alertname: DARSHANMediaCacheFailuresHigh
              severity: warning
              site: dev
              team: platform
            exp_annotations:
              summary: "Media/cache failures are elevated"
              description: "Players are reporting ERROR or CRITICAL media/cache failures above the warning threshold."
      - eval_time: 20m
        alertname: DARSHANCriticalMediaCacheReportsUnresolved
        exp_alerts:
          - exp_labels:
              alertname: DARSHANCriticalMediaCacheReportsUnresolved
              severity: critical
              site: dev
              team: platform
            exp_annotations:
              summary: "Critical media/cache failures remain unresolved"
              description: "At least one critical player media/cache failure report is still open."
