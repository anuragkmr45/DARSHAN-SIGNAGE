groups:
  - name: darshan_host_utilization
    interval: 1m
    rules:
      - record: darshan:host_cpu_utilization:ratio
        expr: |
          1 - avg by (job, instance, role, machine, site) (
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          )
      - record: darshan:host_memory_utilization:ratio
        expr: |
          1 - (
            node_memory_MemAvailable_bytes
            /
            node_memory_MemTotal_bytes
          )
      - record: darshan:host_filesystem_utilization:ratio
        expr: |
          max by (job, instance, role, machine, site) (
            1 - (
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint!~"/run($|/.*)|/var/lib/docker($|/.*)"}
              /
              node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint!~"/run($|/.*)|/var/lib/docker($|/.*)"}
            )
          )

  - name: darshan_backend_service
    interval: 1m
    rules:
      - record: darshan:backend_http_request_rate_per_second
        expr: |
          sum by (site) (
            rate(darshan_server_http_requests_total[5m])
          )
      - record: darshan:backend_http_error_rate:ratio
        expr: |
          sum by (site) (
            rate(darshan_server_http_requests_total{status_class="5xx"}[5m])
          )
          /
          clamp_min(
            sum by (site) (
              rate(darshan_server_http_requests_total[5m])
            ),
            1
          )
      - record: darshan:fleet_total_players
        expr: |
          sum by (site) (
            darshan_fleet_players_total
          )
      - record: darshan:fleet_offline_players_ratio
        expr: |
          sum by (site) (
            darshan_fleet_players_total{state="OFFLINE"}
          )
          /
          clamp_min(
            sum by (site) (
              darshan_fleet_players_total
            ),
            1
          )

  - name: darshan_realtime_sync
    interval: 1m
    rules:
      - record: darshan:realtime_outbox_pending_rows
        expr: |
          sum by (site) (
            darshan_server_command_outbox_rows{status="PENDING"}
          )
      - record: darshan:realtime_outbox_dispatch_failure_rate_per_second
        expr: |
          sum by (site) (
            rate(darshan_server_command_outbox_dispatch_total{result="failed"}[5m])
          )
      - record: darshan:realtime_payload_too_large_rate_per_second
        expr: |
          sum by (site) (
            rate(darshan_server_websocket_notification_payload_too_large_total[5m])
          )
      - record: darshan:realtime_valkey_publish_failure_rate_per_second
        expr: |
          sum by (site) (
            rate(darshan_server_realtime_bus_publish_total{provider="valkey",result=~"failed|unavailable"}[5m])
          )
      - record: darshan:realtime_valkey_fallback_rate_per_second
        expr: |
          sum by (site) (
            rate(darshan_server_realtime_bus_fallback_total[5m])
          )
      - record: darshan:realtime_fallback_poll_claim_rate_per_second
        expr: |
          sum by (site) (
            rate(darshan_server_device_commands_claimed_total{source="poll"}[5m])
          )
      - record: darshan:device_command_ack_failure_ratio
        expr: |
          sum by (site) (
            rate(darshan_server_device_command_acks_total{result=~"failure|error"}[5m])
          )
          /
          clamp_min(
            sum by (site) (
              rate(darshan_server_device_command_acks_total[5m])
            ),
            1
          )
      - record: darshan:media_cache_failure_rate_per_second
        expr: |
          sum by (site) (
            rate(darshan_server_media_cache_reports_total{result="accepted",severity=~"ERROR|CRITICAL"}[5m])
          )
