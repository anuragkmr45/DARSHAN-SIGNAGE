groups:
  - name: darshan_platform_alerts
    interval: 1m
    rules:
      - alert: DARSHANPrometheusUnavailable
        expr: up{job="prometheus"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Prometheus is unavailable"
          description: "Prometheus on {{ $labels.instance }} has been unreachable for 5 minutes."

      - alert: DARSHANBackendMetricsUnavailable
        expr: up{job="darshan-server"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Backend metrics are unavailable"
          description: "darshan-server on {{ $labels.instance }} has been unreachable for 5 minutes."

      - alert: DARSHANVm1DataMetricsUnavailable
        expr: up{job=~"vm1-node|vm1-postgres|vm1-minio"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Data VM metrics target is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for 5 minutes."

      - alert: DARSHANVm3HostMetricsUnavailable
        expr: up{job="vm3-node"} == 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "CMS VM host metrics are unavailable"
          description: "vm3-node on {{ $labels.instance }} has been unreachable for 10 minutes."

      - alert: DARSHANValkeyHostMetricsUnavailable
        expr: up{job="vm-valkey-node"} == 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Valkey VM host metrics are unavailable"
          description: "vm-valkey-node on {{ $labels.instance }} has been unreachable for 10 minutes."

      - alert: DARSHANBackendHostMetricsUnavailable
        expr: up{job="vm2-node"} == 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Backend VM host metrics are unavailable"
          description: "vm2-node on {{ $labels.instance }} has been unreachable for 10 minutes."

      - alert: DARSHANObservabilityHostMetricsUnavailable
        expr: up{job="vm4-node"} == 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Observability VM host metrics are unavailable"
          description: "vm4-node on {{ $labels.instance }} has been unreachable for 10 minutes."

      - alert: DARSHANAlertmanagerMetricsUnavailable
        expr: up{job="vm4-alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Alertmanager metrics are unavailable"
          description: "Alertmanager on {{ $labels.instance }} has been unreachable for 5 minutes."

      - alert: DARSHANGrafanaMetricsUnavailable
        expr: up{job="vm4-grafana"} == 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Grafana metrics are unavailable"
          description: "Grafana on {{ $labels.instance }} has been unreachable for 10 minutes."

      - alert: DARSHANPostgresUnavailable
        expr: pg_up == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL is unavailable"
          description: "postgres_exporter can reach {{ $labels.instance }}, but PostgreSQL is reporting down."

      - alert: DARSHANMinioMetricsUnavailable
        expr: up{job="vm1-minio"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "MinIO metrics are unavailable"
          description: "MinIO cluster metrics on {{ $labels.instance }} have been unreachable for 5 minutes."

      - alert: DARSHANBackendHttp5xxHigh
        expr: darshan:backend_http_error_rate:ratio > 0.05
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Backend 5xx rate is elevated"
          description: "The backend 5xx ratio has been above 5% for 10 minutes."

      - alert: DARSHANHostCpuHigh
        expr: darshan:host_cpu_utilization:ratio > 0.85
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Host CPU utilization is high"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been above 85% CPU for 15 minutes."

      - alert: DARSHANHostFilesystemHigh
        expr: darshan:host_filesystem_utilization:ratio{job!="vm1-node"} > 0.90
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Host filesystem utilization is high"
          description: "{{ $labels.job }} on {{ $labels.instance }} has a filesystem above 90% utilization."

      - alert: DARSHANVm1DataFilesystemHigh
        expr: darshan:host_filesystem_utilization:ratio{job="vm1-node"} > 0.85
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Data VM filesystem utilization is high"
          description: "Data VM storage on {{ $labels.instance }} has been above 85% utilization for 10 minutes and may impact PostgreSQL or MinIO."

      # These are rendered from the signed site operations policy. Absolute
      # free-byte thresholds protect Docker named volumes even where filesystem
      # percentage looks harmless on very large disks.
      - alert: DARSHANDataDockerDiskFreeLow
        expr: min by (instance) (node_filesystem_avail_bytes{job="vm1-node",fstype!~"tmpfs|overlay|squashfs|nsfs"}) < __DATA_MIN_FREE_DISK_BYTES__
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Data VM Docker storage is below its approved free-space threshold"
          description: "Data VM {{ $labels.instance }} has less than the signed minimum free space required for PostgreSQL and MinIO."

      - alert: DARSHANValkeyDockerDiskFreeLow
        expr: min by (instance) (node_filesystem_avail_bytes{job="vm-valkey-node",fstype!~"tmpfs|overlay|squashfs|nsfs"}) < __VALKEY_MIN_FREE_DISK_BYTES__
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Valkey VM Docker storage is below its approved free-space threshold"
          description: "Valkey VM {{ $labels.instance }} has less than the signed minimum free space required for persistent append-only data."

      - alert: DARSHANBackendDockerDiskFreeLow
        expr: min by (instance) (node_filesystem_avail_bytes{job="vm2-node",fstype!~"tmpfs|overlay|squashfs|nsfs"}) < __BACKEND_MIN_FREE_DISK_BYTES__
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Backend VM Docker storage is below its approved free-space threshold"
          description: "Backend VM {{ $labels.instance }} has less than the signed minimum free space required for application, worker, and transient workload data."

      - alert: DARSHANCmsDockerDiskFreeLow
        expr: min by (instance) (node_filesystem_avail_bytes{job="vm3-node",fstype!~"tmpfs|overlay|squashfs|nsfs"}) < __CMS_MIN_FREE_DISK_BYTES__
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "CMS VM Docker storage is below its approved free-space threshold"
          description: "CMS VM {{ $labels.instance }} has less than the signed minimum free space required for CMS runtime data."

      - alert: DARSHANObservabilityDockerDiskFreeLow
        expr: min by (instance) (node_filesystem_avail_bytes{job="vm4-node",fstype!~"tmpfs|overlay|squashfs|nsfs"}) < __OBSERVABILITY_MIN_FREE_DISK_BYTES__
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Observability VM Docker storage is below its approved free-space threshold"
          description: "Observability VM {{ $labels.instance }} has less than the signed minimum free space required for Prometheus, Alertmanager, and Grafana data."

      - alert: DARSHANHostMemoryHigh
        expr: darshan:host_memory_utilization:ratio > 0.90
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Host memory utilization is high"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been above 90% memory utilization for 15 minutes."

      - alert: DARSHANFleetHeartbeatsStalled
        expr: darshan_fleet_latest_heartbeat_age_seconds > 600 and darshan:fleet_total_players >= 1
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Player fleet heartbeats are stalled"
          description: "The backend has not recorded a fresh player heartbeat for more than 10 minutes."

      - alert: DARSHANFleetOfflinePlayersHigh
        expr: darshan:fleet_offline_players_ratio > 0.25 and darshan:fleet_total_players >= 4
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Offline player ratio is elevated"
          description: "More than 25% of the known player fleet has been marked OFFLINE for 15 minutes."

      - alert: DARSHANRealtimeOutboxLagHigh
        expr: darshan_server_command_outbox_oldest_pending_age_seconds > 120
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime outbox lag is elevated"
          description: "The oldest pending realtime outbox row has been waiting for more than 2 minutes."

      - alert: DARSHANRealtimeOutboxDispatchFailures
        expr: darshan:realtime_outbox_dispatch_failure_rate_per_second > 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime outbox dispatch failures detected"
          description: "The outbox dispatcher has recorded failed notification dispatch attempts."

      - alert: DARSHANRealtimePayloadTooLarge
        expr: darshan:realtime_payload_too_large_rate_per_second > 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Realtime notification payload rejected"
          description: "One or more websocket notification payloads exceeded the configured hard limit."

      - alert: DARSHANRealtimeValkeyPublishFailures
        expr: darshan:realtime_valkey_publish_failure_rate_per_second > 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Valkey realtime fanout publish failures detected"
          description: "Valkey wake notification fanout is failing. DB outbox, REST, polling, and heartbeat fallback must remain active."

      - alert: DARSHANRealtimeValkeyFallbackHigh
        expr: darshan:realtime_valkey_fallback_rate_per_second > 0.1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime fanout fallback rate is elevated"
          description: "Players are relying on durable DB/REST/polling fallback because Valkey fanout is unavailable or device-node mappings are missing."

      - alert: DARSHANRealtimeAuthFailuresHigh
        expr: sum by (site) (rate(darshan_server_device_realtime_auth_total{result="failure"}[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime device authentication failures are elevated"
          description: "Device websocket authentication failures exceed 0.5 attempts per second."

      - alert: DARSHANCommandAckFailuresHigh
        expr: darshan:device_command_ack_failure_ratio > 0.10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Device command ACK failures are elevated"
          description: "More than 10% of command acknowledgements are failing or returning error."

      - alert: DARSHANDeviceCommandDeadLettersPresent
        expr: sum by (site) (darshan_server_device_commands_rows{status=~"DEAD_LETTER|EXPIRED"}) > 0
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Terminal failed device commands are present"
          description: "Device commands have reached DEAD_LETTER or EXPIRED status and need operator review."

      - alert: DARSHANMediaCacheFailuresHigh
        expr: darshan:media_cache_failure_rate_per_second > 0.1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Media/cache failures are elevated"
          description: "Players are reporting ERROR or CRITICAL media/cache failures above the warning threshold."

      - alert: DARSHANCriticalMediaCacheReportsUnresolved
        expr: sum by (site) (darshan_server_media_cache_reports_unresolved{severity="CRITICAL"}) > 0
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Critical media/cache failures remain unresolved"
          description: "At least one critical player media/cache failure report is still open."
