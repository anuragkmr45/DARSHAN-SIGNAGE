services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.3.1}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../../../deploy/shared/observability/prometheus/rules:/etc/darshan/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.0.2}
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      PROMETHEUS_UPSTREAM_URL: http://prometheus:9090
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ../../../../deploy/shared/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../../deploy/shared/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/grafana/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  prometheus_data:
  grafana_data:
