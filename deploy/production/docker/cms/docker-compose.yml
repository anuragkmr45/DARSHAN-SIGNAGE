services:
  cms:
    build:
      context: ../../../..
      dockerfile: deploy/production/docker/cms/Dockerfile
    image: ${CMS_IMAGE:-darshan-cms:production}
    restart: unless-stopped
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PRIVATE_HOST: ${BACKEND_PRIVATE_HOST:-${BACKEND_HOST}}
      BACKEND_PORT: ${API_HOST_PORT}
      MINIO_HOST: ${MINIO_HOST:-${DATA_HOST}}
      MINIO_PORT: ${MINIO_PORT:-9000}
      GRAFANA_HOST: ${OBSERVABILITY_HOST}
      GRAFANA_PORT: ${GRAFANA_PORT}
    ports:
      - "${CMS_HTTP_PORT}:80"
    volumes:
      - ${CMS_RUNTIME_CONFIG_SOURCE:-../../../../darshan-cms/public/config/app-config.json}:/usr/share/nginx/html/config/app-config.json:ro
      - ${DARSHAN_BACKEND_TRANSPORT_CA_FILE:-../../../../darshan-server/certs/transport-ca.crt}:/etc/darshan/transport-ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
