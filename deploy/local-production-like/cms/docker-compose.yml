services:
  cms:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${API_HOST_PORT}
      GRAFANA_HOST: ${OBSERVABILITY_HOST}
      GRAFANA_PORT: ${GRAFANA_PORT}
    ports:
      - "${CMS_HTTP_PORT}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../../darshan-cms/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
